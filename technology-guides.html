<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="NEXORA DIGITAL Technology Guides — Learn about modern technology, computers, the internet, web development and digital technology."
    >

    <meta
        name="theme-color"
        content="#06111f"
    >

    <title>
        Technology Guides | NEXORA DIGITAL
    </title>


    <style>

        /* =====================================================
           NEXORA DIGITAL
           TECHNOLOGY GUIDES PAGE
        ===================================================== */


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #06111f;

            color: #ffffff;

            line-height: 1.7;

            overflow-x: hidden;
        }


        a {
            color: inherit;

            text-decoration: none;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            position: sticky;

            top: 0;

            z-index: 1000;

            background:
                rgba(5, 16, 29, 0.97);

            border-bottom:
                1px solid #17304a;

            backdrop-filter:
                blur(12px);
        }


        .navbar {

            width: 100%;

            max-width: 1200px;

            margin: 0 auto;

            padding:
                20px 30px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .brand img {

            width: 50px;

            height: 50px;

            object-fit: contain;

            border-radius: 8px;
        }


        .brand-name {

            color: #4ddcff;

            font-size: 30px;

            font-weight: 900;

            letter-spacing: 0.5px;
        }


        .back-link {

            padding:
                11px 18px;

            border:
                1px solid #31516b;

            border-radius: 8px;

            color: #ffffff;

            font-size: 15px;

            font-weight: 700;

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                color 0.25s ease;
        }


        .back-link:hover {

            background:
                rgba(77, 220, 255, 0.08);

            border-color:
                #4ddcff;

            color:
                #4ddcff;
        }


        /* =====================================================
           HERO
        ===================================================== */

        .page-hero {

            padding:
                100px 25px 80px;

            text-align: center;

            background:

                radial-gradient(
                    circle at 20% 20%,
                    rgba(25, 102, 145, 0.25),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 80% 70%,
                    rgba(0, 205, 255, 0.12),
                    transparent 35%
                ),

                #06111f;
        }


        .page-label {

            display: inline-block;

            margin-bottom: 25px;

            padding:
                9px 20px;

            border:
                1px solid #245773;

            border-radius: 50px;

            color: #4ddcff;

            font-size: 13px;

            font-weight: 900;

            letter-spacing: 1.5px;
        }


        .page-hero h1 {

            margin-bottom: 20px;

            font-size:
                clamp(42px, 8vw, 76px);

            line-height: 1;

            font-weight: 900;
        }


        .page-hero h1 span {

            color: #4ddcff;
        }


        .page-hero p {

            max-width: 760px;

            margin: 0 auto;

            color: #a9bdcf;

            font-size: 19px;

            line-height: 1.8;
        }


        /* =====================================================
           MAIN CONTENT
        ===================================================== */

        .guide-container {

            width: 100%;

            max-width: 1000px;

            margin: 0 auto;

            padding:
                80px 25px;
        }


        .guide-card {

            margin-bottom: 25px;

            padding:
                40px;

            background: #0b1d2e;

            border:
                1px solid #1b3851;

            border-radius: 20px;
        }


        .guide-card h2 {

            margin-bottom: 18px;

            color: #ffffff;

            font-size: 30px;

            line-height: 1.25;
        }


        .guide-card h3 {

            margin-top: 28px;

            margin-bottom: 10px;

            color: #4ddcff;

            font-size: 22px;
        }


        .guide-card p {

            margin-bottom: 16px;

            color: #a9bdcf;

            font-size: 17px;
        }


        .guide-card ul {

            margin:
                15px 0 20px 25px;

            color: #a9bdcf;
        }


        .guide-card li {

            margin-bottom: 10px;
        }


        .guide-card strong {

            color: #ffffff;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            padding:
                35px 20px;

            background:
                #040b14;

            border-top:
                1px solid #13283c;

            text-align: center;

            color: #71879b;
        }


        footer strong {

            color: #4ddcff;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .navbar {

                padding:
                    17px 15px;

                flex-direction: column;

                gap: 15px;
            }


            .brand-name {

                font-size: 25px;
            }


            .page-hero {

                padding:
                    75px 18px 60px;
            }


            .page-hero h1 {

                font-size: 45px;
            }


            .page-hero p {

                font-size: 16px;
            }


            .guide-container {

                padding:
                    55px 18px;
            }


            .guide-card {

                padding:
                    28px 22px;
            }


            .guide-card h2 {

                font-size: 26px;
            }


            .guide-card p,
            .guide-card li {

                font-size: 16px;
            }

        }

    </style>

</head>


<body>

    <header>

        <div class="navbar">


            <a

                    src="nexora-digital-logo.png"

                >

                <span class="brand-name">
                    NEXORA DIGITAL
                </span>

            </a>


            <a
                href="index.html#learn"
                class="back-link"
            >
                ← Back to Learn
            </a>

        </div>

    </header>



    <!-- =====================================================
         PAGE HERO
    ===================================================== -->

    <section class="page-hero">

        <div class="page-label">
            01 — KNOWLEDGE
        </div>


        <h1>
            Technology
            <span>Guides</span>
        </h1>


        <p>
            Explore practical explanations of modern
            technology, computers, the internet,
            web development and digital systems.
        </p>

    </section>



    <!-- =====================================================
         TECHNOLOGY GUIDE CONTENT
         
         JavaScript will load the actual content here.
    ===================================================== -->

    <main
        id="technologyGuideContent"
        class="guide-container"
    >

        <p>
            Loading Technology Guides...
        </p>

    </main>



    <!-- =====================================================
         FOOTER
    ===================================================== -->

    <footer>

        <p>

            © 2026

            <strong>
                NEXORA DIGITAL
            </strong>.

            All Rights Reserved.

        </p>


        <p>
            Developed by Steven Fidel.
        </p>

    </footer>



    <!-- =====================================================
         TECHNOLOGY GUIDES JAVASCRIPT
    ===================================================== -->

    <script src="technology-guides.js"></script>


</body>

  </html>
