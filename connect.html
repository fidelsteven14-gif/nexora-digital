<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect | Nezora Wi-Fi</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #07111f;
      color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 7%;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
    }

    .logo span {
      color: #39d98a;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .connect-card {
      width: 100%;
      max-width: 430px;
      background: #0d1b2c;
      border: 1px solid #1c3047;
      border-radius: 20px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    .wifi {
      width: 75px;
      height: 75px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(57,217,138,0.12);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 34px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 30px;
    }

    .description {
      color: #9fb0c3;
      margin-bottom: 28px;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 8px;
      color: #d9e4ef;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #33455d;
      background: #07111f;
      color: white;
      font-size: 17px;
      outline: none;
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #39d98a;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #39d98a;
      color: #04100a;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: #51e39a;
    }

    #message {
      margin-top: 18px;
      min-height: 24px;
      font-size: 14px;
    }

    .back {
      display: inline-block;
      margin-top: 22px;
      color: #9fb0c3;
      font-size: 14px;
    }

    .back:hover {
      color: #39d98a;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #718399;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      NEZORA <span>WI-FI</span>
    </div>
  </header>

  <main>

    <div class="connect-card">

      <div class="wifi">📶</div>

      <h1>Connect to Wi-Fi</h1>

      <p class="description">
        Enter your Nezora Wi-Fi voucher code to continue.
      </p>

      <form id="connectForm">

        <label for="voucher">
          Voucher Code
        </label>

        <input
          type="text"
          id="voucher"
          name="voucher"
          placeholder="Enter voucher code"
          autocomplete="off"
          required
        >

        <button type="submit">
          Connect
        </button>

      </form>

      <div id="message"></div>

      <a href="index.html" class="back">
        ← Back to Nezora Wi-Fi
      </a>

    </div>

  </main>

  <footer>
    © 2026 Nezora Wi-Fi. All rights reserved.
  </footer>

  <script>
    const form = document.getElementById("connectForm");
    const voucherInput = document.getElementById("voucher");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const voucher = voucherInput.value.trim();

      if (!voucher) {
        message.textContent = "Please enter your voucher code.";
        return;
      }

      message.textContent = "Checking voucher...";

      try {
        const response = await fetch("/api/vouchers/validate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            code: voucher
          })
        });

        const data = await response.json();

        if (response.ok && data.valid) {
          message.textContent =
            "Voucher accepted. Connecting...";
        } else {
          message.textContent =
            data.message || "Invalid or expired voucher.";
        }

      } catch (error) {
        message.textContent =
          "Unable to connect to the Nezora Wi-Fi service.";
      }
    });
  </script>

</body>
</html>
