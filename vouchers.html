<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXORA Wi-Fi — Voucher Generator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b1120;
      color: #ffffff;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .header p {
      color: #94a3b8;
    }

    .generator {
      background: #111827;
      border: 1px solid #263244;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #e5e7eb;
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #0f172a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    select:focus {
      border-color: #22c55e;
    }

    .generate-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      background: #22c55e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate-btn:hover {
      background: #16a34a;
    }

    .voucher-area {
      display: none;
      margin-top: 25px;
    }

    .voucher {
      background: white;
      color: #111827;
      border-radius: 14px;
      padding: 25px;
      text-align: center;
      border: 3px dashed #111827;
    }

    .voucher-brand {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .voucher-title {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .package-name {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .voucher-code-label {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 5px;
    }

    .voucher-code {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 15px;
    }

    .voucher-info {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 15px 0;
      padding: 15px 0;
      border-top: 1px solid #e5e7eb;
      border-bottom: 1px solid #e5e7eb;
    }

    .info-item span {
      display: block;
      font-size: 12px;
      color: #64748b;
    }

    .info-item strong {
      font-size: 16px;
    }

    .instructions {
      font-size: 13px;
      color: #475569;
      margin-top: 15px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .action-btn {
      flex: 1;
      border: none;
      padding: 13px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .print-btn {
      background: #2563eb;
      color: white;
    }

    .new-btn {
      background: #374151;
      color: white;
    }

    @media (max-width: 500px) {
      .voucher-info {
        gap: 15px;
      }

      .voucher-code {
        font-size: 24px;
        letter-spacing: 3px;
      }

      .actions {
        flex-direction: column;
      }
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .header,
      .generator,
      .actions {
        display: none !important;
      }

      .voucher-area {
        display: block !important;
        margin: 0;
      }

      .voucher {
        border: 3px dashed #111827;
        box-shadow: none;
        margin: 20px;
      }
    }
  </style>
</head>

      <p>Wi-Fi Voucher Generator</p>
