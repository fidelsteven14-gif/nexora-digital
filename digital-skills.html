<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="NEXORA DIGITAL — Practical digital skills and technology learning."
    >

    <meta
        name="theme-color"
        content="#06111f"
    >

    <title>Digital Skills | NEXORA DIGITAL</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #06111f;

            color: #ffffff;

            line-height: 1.7;

            min-height: 100vh;

        }


        a {
            text-decoration: none;
            color: inherit;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            position: sticky;

            top: 0;

            z-index: 1000;

            background:
                rgba(5, 16, 29, 0.97);

            border-bottom:
                1px solid #17304a;

            backdrop-filter:
                blur(12px);

        }


        .navbar {

            max-width: 1200px;

            margin: 0 auto;

            padding:
                20px 30px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .brand img {

            width: 52px;

            height: 52px;

            object-fit: contain;

        }


        .brand-name {

            color: #4ddcff;

            font-size: 30px;

            font-weight: 900;

            letter-spacing: 1px;

        }


        .back-link {

            color: #dce8f3;

            font-size: 16px;

            font-weight: 700;

            padding:
                10px 18px;

            border:
                1px solid #31516b;

            border-radius: 8px;

            transition:
                all 0.25s ease;

        }


        .back-link:hover {

            color: #06111f;

            background: #4ddcff;

            border-color: #4ddcff;

        }


        /* =====================================================
           HERO
        ===================================================== */

        .page-hero {

            max-width: 1000px;

            margin: 0 auto;

            padding:
                100px 25px 70px;

            text-align: center;

        }


        .page-number {

            display: inline-block;

            margin-bottom: 20px;

            color: #4ddcff;

            font-size: 14px;

            font-weight: 900;

            letter-spacing: 2px;

        }


        .page-hero h1 {

            margin-bottom: 25px;

            font-size:
                clamp(45px, 8vw, 75px);

            line-height: 1.05;

        }


        .page-hero h1 span {

            color: #4ddcff;

        }


        .page-hero p {

            max-width: 760px;

            margin: 0 auto;

            color: #a9bdcf;

            font-size: 19px;

        }


        /* =====================================================
           CONTENT
        ===================================================== */

        .content-container {

            max-width: 1000px;

            margin: 0 auto;

            padding:
                20px 25px 100px;

        }


        .content-card {

            padding:
                45px;

            margin-bottom: 25px;

            background: #0b1d2e;

            border:
                1px solid #1b3851;

            border-radius: 22px;

        }


        .content-card h2 {

            margin-bottom: 18px;

            color: #ffffff;

            font-size: 32px;

        }


        .content-card h3 {

            margin-top: 30px;

            margin-bottom: 12px;

            color: #4ddcff;

            font-size: 23px;

        }


        .content-card p {

            margin-bottom: 18px;

            color: #a9bdcf;

            font-size: 17px;

        }


        .content-card ul {

            margin:
                0 0 20px 25px;

            color: #a9bdcf;

        }


        .content-card li {

            margin-bottom: 12px;

        }


        .content-card strong {

            color: #ffffff;

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            padding:
                30px 20px;

            background: #040b14;

            border-top:
                1px solid #13283c;

            text-align: center;

            color: #71879b;

        }


        footer strong {

            color: #4ddcff;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .navbar {

                padding:
                    16px 15px;

            }


            .brand-name {

                font-size: 22px;

            }


            .brand img {

                width: 44px;

                height: 44px;

            }


            .back-link {

                padding:
                    8px 12px;

                font-size: 14px;

            }


            .page-hero {

                padding:
                    70px 18px 50px;

            }


            .page-hero h1 {

                font-size: 44px;

            }


            .page-hero p {

                font-size: 17px;

            }


            .content-container {

                padding:
                    15px 18px 70px;

            }


            .content-card {

                padding:
                    28px 22px;

            }


            .content-card h2 {

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <div class="navbar">


            <a
                href="index.html"
                class="brand"
            >

                <img
                    src="nexora-digital-logo.png"
                    alt="NEXORA DIGITAL Logo"
                >

                <span class="brand-name">
                    NEXORA DIGITAL
                </span>

            </a>


            <a
                href="index.html#learn"
                class="back-link"
            >
                ← Back to Learn
            </a>

        </div>

    </header>



    <!-- =====================================================
         PAGE INTRODUCTION
    ====================================================== -->

    <main>

        <section class="page-hero">

            <div class="page-number">
                02 — SKILLS
            </div>


            <h1>
                Digital <span>Skills</span>
            </h1>


            <p>
                Practical knowledge and skills for becoming
                more confident when using computers, digital
                devices, software and online services.
            </p>

        </section>



        <!-- =================================================
             CONTENT
        ================================================== -->

        <section class="content-container">

            <article
                class="content-card"
                id="digitalSkillsContent"
            >

                <!-- JavaScript will place the learning
                     content here. -->

                <p>
                    Loading Digital Skills...
                </p>

            </article>

        </section>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        <p>

            © 2026

            <strong>
                NEXORA DIGITAL
            </strong>.

            All Rights Reserved.

        </p>

    </footer>



    <!-- =====================================================
         DIGITAL SKILLS JAVASCRIPT
    ====================================================== -->

    <script src="digital-skills.js"></script>


</body>

  </html>
